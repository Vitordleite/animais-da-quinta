<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jogos das Pequenitas 🐮</title>
<style>
  :root{
    --bg1:#bfe9ff; --bg2:#e9fbd3; --card:#ffffff; --ink:#3a2f5b;
    --a:#ff7a59; --b:#ffc83d; --c:#4cc38a; --d:#5b8def;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%}
  body{
    font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    min-height:100vh; overflow-x:hidden;
  }
  header{text-align:center;padding:14px 10px 4px}
  h1{margin:0;font-size:36px;font-size:clamp(26px,6vw,46px);letter-spacing:1px}
  .stars{font-size:24px;font-size:clamp(20px,4vw,28px);min-height:34px}
  nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 10px}
  nav button, .btn{
    font:inherit;font-size:19px;font-size:clamp(16px,3.6vw,22px);font-weight:bold;
    border:none;border-radius:999px;padding:12px 22px;cursor:pointer;color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s;
  }
  nav button:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #m1{background:var(--a)} #m2{background:var(--c)} #m3{background:var(--d)} #m4{background:#a867d8} #m5{background:#1fa6b8} #m6{background:#e0568a}

  /* ── jogo "Encontra-nos!" (estilo Onde está o Wally) ── */
  main.scene-wrap{display:block;max-width:980px}
  .prompt .mini{width:48px;height:48px;border-radius:50%;object-fit:cover;vertical-align:middle;border:3px solid var(--b);margin-right:6px}
  .scene{position:relative;overflow:hidden;border-radius:26px;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12);
         background:linear-gradient(180deg,#bfe9ff 0%,#d9f3ff 34%,#a6e38f 34%,#8fd87a 100%)}
  .stk{position:absolute;text-align:center;pointer-events:auto}
  .face{position:absolute;border-radius:50%;overflow:hidden;border:4px solid var(--b);background:#fff;
        box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer;z-index:3;transition:transform .5s}
  .face.m{border-color:var(--a)}
  .face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .face.found{transform:scale(2.4);z-index:60!important;box-shadow:0 0 0 8px rgba(255,200,61,.7),0 8px 0 rgba(0,0,0,.2)}
  .face.nope{animation:bounce .7s}
  .hintring{position:absolute;border:6px dashed var(--a);border-radius:50%;pointer-events:none;z-index:40;animation:pulse .8s ease-in-out 4}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.3);opacity:.35}}
  .missring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid rgba(255,255,255,.95);
            pointer-events:none;z-index:30;animation:missr .5s ease-out forwards}
  @keyframes missr{to{transform:scale(2.2);opacity:0}}

  /* ── jogo "Conta até 10" ── */
  main.count-wrap{display:block;max-width:760px}
  .cbox{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff;border-radius:26px;border:5px solid #fff;
        box-shadow:0 7px 0 rgba(0,0,0,.12);padding:14px 10px;margin:0 auto 14px;min-height:120px}
  .cit{position:relative;width:76px;height:76px;margin:5px;line-height:76px;font-size:54px;text-align:center;cursor:pointer;
       -webkit-user-select:none;user-select:none;transition:transform .15s}
  .cit .bd{position:absolute;right:-2px;bottom:-2px;min-width:30px;height:30px;line-height:30px;border-radius:15px;background:var(--d);color:#fff;
           font-size:18px;font-weight:bold;box-shadow:0 2px 0 rgba(0,0,0,.2);display:none}
  .cit.on{transform:scale(1.18)} .cit.on .bd{display:block}
  .cit.pop{animation:bounce .6s}
  .choices{display:flex;flex-wrap:wrap;justify-content:center}
  .num{font:inherit;font-size:44px;font-weight:bold;width:92px;height:92px;margin:7px;border:none;border-radius:50%;color:#fff;cursor:pointer;
       box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
  .num:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .num.good{outline:6px solid #fff;animation:bounce .7s}
  .plate{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;min-height:110px;margin:0 auto 14px;border-radius:26px;
         border:5px dashed var(--d);background:rgba(255,255,255,.6);padding:10px}
  .plate .cit{cursor:default}
  .big{font-size:56px;font-weight:bold;color:var(--d);margin:0 8px;vertical-align:middle}

  /* ── jogo "As cores" ── */
  main.color-wrap{display:block;max-width:760px}
  .sw{width:110px;height:110px;margin:8px;border-radius:50%;border:6px solid #fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
  .sw:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .sw.good{animation:bounce .7s;outline:6px solid var(--b)}
  .cobj{background:#fff;border-radius:26px;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12);text-align:center;margin:0 auto 14px;padding:10px;max-width:320px}
  .cobj .e2{font-size:96px;line-height:1.15}
  .cobj .n2{font-size:26px;font-weight:bold}

  /* ── menu inicial e histórias ── */
  main.menu-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:760px;padding-top:14px}
  .bigbtn{font:inherit;font-size:30px;font-size:clamp(22px,6vw,36px);font-weight:bold;color:#fff;border:none;border-radius:34px;cursor:pointer;
          width:300px;max-width:88%;padding:26px 14px;box-shadow:0 9px 0 rgba(0,0,0,.2);transition:transform .1s}
  .bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .bigbtn .bi{display:block;font-size:84px;line-height:1.1;margin-bottom:6px}
  .bigbtn.story{width:260px}
  nav #mh{background:#8a7fb0}
  main.story-wrap{display:block;max-width:760px}
  .story{position:relative;border-radius:28px;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12);padding:14px 10px 18px;text-align:center;overflow:hidden}
  .story .chars{display:flex;justify-content:center;gap:14px;margin-bottom:6px}
  .story .chars img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:4px solid var(--b);background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .story .chars img.m{border-color:var(--a)}
  .sit{display:inline-block;font-size:80px;font-size:clamp(56px,15vw,110px);line-height:1.15;margin:0 6px;cursor:pointer;
       animation:sway 3s ease-in-out infinite;-webkit-user-select:none;user-select:none}
  .sit:nth-child(2){animation-delay:.5s} .sit:nth-child(3){animation-delay:1s} .sit:nth-child(4){animation-delay:1.5s}
  .sit.bounce{animation:bounce .7s}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  .stext{background:rgba(255,255,255,.92);border-radius:22px;margin:12px 6px 0;padding:14px 16px;font-size:22px;font-size:clamp(19px,4.6vw,28px);line-height:1.45;text-align:left}
  .sctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .sctl .btn{background:var(--d);color:#fff}
  .sctl .btn[disabled]{opacity:.35;cursor:default}
  .prompt .pg{font-size:18px;opacity:.7;margin-left:8px}
  nav button.on{outline:5px solid #fff;outline-offset:2px}
  .prompt{text-align:center;font-size:26px;font-size:clamp(20px,4.5vw,32px);margin:8px 10px;min-height:46px}
  .prompt .btn{background:var(--b);color:var(--ink);margin-left:8px;padding:8px 18px}
  main{
    display:grid;grid-gap:14px;gap:14px;padding:10px 14px 30px;max-width:980px;margin:0 auto;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  }
  main.few{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-width:760px}
  .card{
    background:var(--card);border-radius:28px;padding:10px 6px 12px;text-align:center;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.12);border:5px solid transparent;
    transition:transform .1s;
  }
  .card:active{transform:scale(.94)}
  .card .e{font-size:77px;font-size:clamp(58px,15vw,96px);line-height:1.1;display:block}
  .card .n{font-size:19px;font-size:clamp(16px,3.6vw,22px);font-weight:bold}
  .card.hide-name .n{visibility:hidden}
  .bounce{animation:bounce .7s}
  @keyframes bounce{
    0%{transform:scale(1)} 20%{transform:scale(1.18) rotate(-6deg)}
    40%{transform:scale(.95) rotate(5deg)} 60%{transform:scale(1.12) rotate(-4deg)}
    80%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1)}
  }
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .good{border-color:var(--c)}

  /* ── animações dos animais ── */
  .card{position:relative}
  .card .e{display:block;width:fit-content;margin:0 auto;transform-origin:50% 80%}
  .card .e svg{width:1em;height:1em;vertical-align:-.12em}
  .card.playing{border-color:var(--b);box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 6px rgba(255,200,61,.35)}
  .ring{position:absolute;left:50%;top:42%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
        border:5px solid var(--b);opacity:.8;pointer-events:none;animation:ring 1.1s ease-out forwards}
  @keyframes ring{to{transform:scale(5);opacity:0}}
  .fx{position:fixed;z-index:15;pointer-events:none;font-size:28px;font-size:clamp(22px,5vw,34px);transform:translate(-50%,-50%);
      animation:fx 1.5s ease-out forwards}
  @keyframes fx{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}
                to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot))}}
  .an-sway{animation:sway 2s ease-in-out}
  @keyframes sway{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) translateX(-8px)}35%{transform:rotate(12deg) translateX(8px)}55%{transform:rotate(-9deg)}75%{transform:rotate(7deg)}}
  .an-hop{animation:hop 1.8s ease-in-out}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:scale(1.15,.85)}25%{transform:translateY(-34px) scale(.92,1.1)}40%,60%{transform:translateY(0) scale(1.12,.88)}75%{transform:translateY(-34px) scale(.92,1.1)}}
  .an-stretch{animation:stretch 1.8s ease-in-out}
  @keyframes stretch{0%,100%{transform:scale(1,1)}20%{transform:scale(1.3,.78)}45%{transform:scale(.82,1.28) translateY(-6px)}70%{transform:scale(1.15,.9)}}
  .an-fluff{animation:fluff 1.8s ease-in-out}
  @keyframes fluff{0%,100%{transform:scale(1) rotate(0)}20%{transform:scale(1.2) rotate(-6deg)}40%{transform:scale(.95) rotate(5deg)}60%{transform:scale(1.18) rotate(-4deg)}80%{transform:scale(1.02)}}
  .an-wiggle{animation:wiggle 1.6s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-16deg)}20%{transform:rotate(16deg)}30%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg)}55%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
  .an-crow{animation:crow 2.2s ease-in-out}
  @keyframes crow{0%,100%{transform:translateY(0) rotate(0) scale(1)}20%,70%{transform:translateY(-12px) rotate(-14deg) scale(1.25)}30%,60%{transform:translateY(-12px) rotate(-8deg) scale(1.3)}}
  .an-waddle{animation:waddle 1.8s ease-in-out}
  @keyframes waddle{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-10px) rotate(-10deg)}25%{transform:translateX(10px) rotate(10deg)}38%{transform:translateX(-10px) rotate(-10deg)}50%{transform:translateX(10px) rotate(10deg)}65%{transform:translateX(-6px) rotate(-6deg)}80%{transform:translateX(6px) rotate(6deg)}}
  .an-gallop{animation:gallop 1.8s ease-in-out}
  @keyframes gallop{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-14px,-10px) rotate(-8deg)}20%{transform:translate(14px,0) rotate(6deg)}30%{transform:translate(-14px,-10px) rotate(-8deg)}40%{transform:translate(14px,0) rotate(6deg)}55%{transform:translate(-8px,-16px) rotate(-14deg) scale(1.15)}75%{transform:translate(0,0) rotate(0)}}
  .an-headshake{animation:headshake 1.8s ease-in-out}
  @keyframes headshake{0%,100%{transform:rotate(0)}8%{transform:rotate(-18deg) scale(1.1)}16%{transform:rotate(18deg)}24%{transform:rotate(-18deg)}32%{transform:rotate(18deg)}40%{transform:rotate(-14deg) translateY(-8px)}55%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}85%{transform:rotate(6deg)}}
  .an-roar{animation:roar 2.2s ease-in-out}
  @keyframes roar{0%,100%{transform:scale(1)}15%{transform:scale(1.45) translateY(-6px)}22%{transform:scale(1.45) translate(-6px,-6px)}29%{transform:scale(1.45) translate(6px,-6px)}36%{transform:scale(1.45) translate(-6px,-6px)}43%{transform:scale(1.45) translate(6px,-6px)}50%{transform:scale(1.45) translate(-4px,-6px)}60%{transform:scale(1.4)}85%{transform:scale(1.1)}}
  .an-trumpet{animation:trumpet 2s ease-in-out}
  @keyframes trumpet{0%,100%{transform:rotate(0) scale(1)}25%,65%{transform:rotate(-16deg) scale(1.3) translateY(-10px)}35%,55%{transform:rotate(-20deg) scale(1.36) translateY(-12px)}}
  .an-swing{animation:swing 2s ease-in-out;transform-origin:50% -25%!important}
  @keyframes swing{0%,100%{transform:rotate(0)}20%{transform:rotate(30deg)}40%{transform:rotate(-30deg)}60%{transform:rotate(24deg)}80%{transform:rotate(-14deg)}}
  .an-leap{animation:leap 1.8s ease-in-out}
  @keyframes leap{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:scale(1.25,.7)}35%{transform:translateY(-62px) scale(.85,1.2) rotate(-10deg)}55%{transform:translateY(0) scale(1.25,.72)}70%{transform:translateY(-30px) scale(.92,1.1) rotate(8deg)}85%{transform:translateY(0) scale(1.1,.9)}}
  .an-fly{animation:fly 2s ease-in-out}
  @keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(26px,-34px) rotate(14deg)}45%{transform:translate(0,-56px) rotate(0) scale(1.1)}70%{transform:translate(-26px,-30px) rotate(-14deg)}}
  .an-puff{animation:puff 2s ease-in-out}
  @keyframes puff{0%,100%{transform:scale(1)}20%{transform:scale(1.4)}30%{transform:scale(1.32) rotate(-6deg)}40%{transform:scale(1.42) rotate(6deg)}50%{transform:scale(1.34) rotate(-5deg)}65%{transform:scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.card .e{animation-duration:.01s!important}.fx,.ring{display:none}}
  .conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.8s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
  footer{text-align:center;font-size:13px;opacity:.6;padding:0 0 18px}
  #start{
    position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;
  }
  #start .ask{font-size:35px;font-size:clamp(26px,7vw,44px);font-weight:bold}
  .who-row .who{margin:8px}
  nav button{margin:4px}
  .player img{margin-right:6px}
  .who-row{display:flex;gap:27px;gap:clamp(14px,5vw,40px);justify-content:center;flex-wrap:wrap}
  .who{font:inherit;border:none;background:#fff;border-radius:32px;padding:14px 14px 12px;cursor:pointer;
       box-shadow:0 8px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:8px;
       font-size:28px;font-size:clamp(22px,6vw,34px);font-weight:bold;color:var(--ink);transition:transform .1s}
  .who:active{transform:translateY(5px) scale(.97);box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .who img{width:175px;width:clamp(130px,34vw,220px);height:175px;height:clamp(130px,34vw,220px);border-radius:50%;object-fit:cover;
           border:6px solid var(--b);animation:bounce 2.4s infinite}
  .who:nth-child(2) img{border-color:var(--a);animation-delay:.6s}
  /* barra da jogadora, em cima */
  .player{font:inherit;color:var(--ink);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:0}
  .player img{width:78px;width:clamp(64px,16vw,92px);height:78px;height:clamp(64px,16vw,92px);border-radius:50%;object-fit:cover;border:5px solid var(--b);
              box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .player .bubble{background:#fff;border-radius:22px;padding:8px 18px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12);
                  font-size:24px;font-size:clamp(18px,4.6vw,30px);line-height:1.15;position:relative}
  /* depois de entrar: cabeçalho compacto, foto + nome à esquerda */
  header{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px 2px;max-width:980px;margin:0 auto}
  header .sub{flex:1;text-align:center;font-size:16px;font-size:clamp(13px,2.6vw,18px);opacity:.7}
  header .stars{font-size:19px;font-size:clamp(16px,3.4vw,22px);min-height:0;white-space:nowrap}
  .player{gap:8px;flex:none}
  .player img{width:51px;width:clamp(44px,10vw,58px);height:51px;height:clamp(44px,10vw,58px);border-width:3px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .player .bubble{padding:5px 12px;border-radius:16px;font-size:16px;font-size:clamp(13px,3.2vw,18px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
  header .player .bubble::before{left:-7px;margin-top:-7px;border-width:7px;border-left-width:0}
  @media (max-width:560px){header .sub{display:none}header{justify-content:space-between}}
  .player .bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
  .player.hi img{animation:bounce .9s 2}
</style>
</head>
<body>

<div id="start">
  <h1>Jogos das Pequenitas</h1>
  <div class="ask">Quem vai jogar? 💖</div>
  <div class="who-row">
    <button class="who" data-p="benedita"><img src="benedita.jpg" alt="Benedita"><span>Benedita</span></button>
    <button class="who" data-p="mafalda"><img src="mafalda.jpg" alt="Mafalda"><span>Mafalda</span></button>
  </div>
</div>

<header>
  <button id="player" class="player" title="Trocar de jogadora">
    <img id="pPhoto" alt="">
    <span class="bubble"><b id="pHi">Olá!</b> <span id="pName"></span></span>
  </button>
  <div class="sub">Jogos e Histórias das Pequenitas</div>
  <div class="stars" id="stars"></div>
</header>

<nav>
  <button id="mh">🏠 Menu</button>
  <button id="m1" class="on">👆 Toca e ouve</button>
  <button id="m2">👂 Que animal é?</button>
  <button id="m3">🔎 Onde está?</button>
  <button id="m4">🕵️ Encontra-nos!</button>
  <button id="m5">🔢 Conta até 10</button>
  <button id="m6">🎨 As cores</button>
</nav>

<div class="prompt" id="prompt"></div>
<main id="grid"></main>
<footer>
  Feito com ❤️ para a Benedita e a Mafalda<br>
  <details style="max-width:760px;margin:6px auto;text-align:left">
    <summary style="cursor:pointer;text-align:center">Créditos dos sons</summary>
    <p>Gravações do <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>, cortadas e com o volume ajustado. O coelho é um som sintetizado.</p>
    <ul id="credits"></ul>
  </details>
</footer>

<script>
"use strict";

/* ───────────────────────── ÁUDIO (tudo sintetizado, sem ficheiros) ───────────────────────── */
let AC = null, master = null;
function initAudio(){
  if(AC) { if(AC.state==="suspended") AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
  if(typeof loadReal==="function") loadReal();
}

/* oscilador com envolvente de frequência [[t,hz],...], filtro e vibrato */
function voice({type="sawtooth",f,dur,at=0,vol=.3,filt=null,vib=null,trem=null,att=.02,rel=.08}){
  const t0 = AC.currentTime + at;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f[0][1], t0+f[0][0]);
  for(let i=1;i<f.length;i++) o.frequency.linearRampToValueAtTime(f[i][1], t0+f[i][0]);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.setValueAtTime(vol,t0+Math.max(att,dur-rel));
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  let node = o;
  if(filt){
    const bq = AC.createBiquadFilter(); bq.type = filt.type||"bandpass";
    bq.frequency.setValueAtTime(filt.f[0][1],t0);
    for(let i=1;i<filt.f.length;i++) bq.frequency.linearRampToValueAtTime(filt.f[i][1],t0+filt.f[i][0]);
    bq.Q.value = filt.q||2;
    node.connect(bq); node = bq;
  }
  node.connect(g); g.connect(master);
  if(vib){ // vibrato na frequência
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = vib.rate; lg.gain.value = vib.depth;
    l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0+dur+.1);
  }
  if(trem){ // tremolo no volume
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = trem.rate; lg.gain.value = vol*trem.depth;
    l.connect(lg); lg.connect(g.gain); l.start(t0); l.stop(t0+dur+.1);
  }
  o.start(t0); o.stop(t0+dur+.1);
}

let noiseBuf = null;
function noise({dur,at=0,vol=.2,filt={type:"bandpass",f:[[0,1000]],q:1},att=.01,rel=.05}){
  if(!noiseBuf){
    noiseBuf = AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const t0 = AC.currentTime+at;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const bq = AC.createBiquadFilter(); bq.type = filt.type; bq.Q.value = filt.q||1;
  bq.frequency.setValueAtTime(filt.f[0][1],t0);
  for(let i=1;i<filt.f.length;i++) bq.frequency.linearRampToValueAtTime(filt.f[i][1],t0+filt.f[i][0]);
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.setValueAtTime(vol,t0+Math.max(att,dur-rel));
  g.gain.linearRampToValueAtTime(.0001,t0+dur);
  s.connect(bq); bq.connect(g); g.connect(master);
  s.start(t0); s.stop(t0+dur+.1);
}

function decode(ab){
  return new Promise((ok,fail)=>{ const p = AC.decodeAudioData(ab,ok,fail); if(p&&p.catch) p.catch(fail); });
}
/* escolhe a janela mais forte de 'max' segundos e normaliza o volume */
function prepare(buf,max){
  const sr = buf.sampleRate, d = buf.getChannelData(0), n = d.length;
  const win = Math.min(n, Math.round(max*sr)), blk = Math.round(sr*.05);
  const e = []; for(let i=0;i<n;i+=blk){ let s=0; const end=Math.min(n,i+blk); for(let j=i;j<end;j++) s+=d[j]*d[j]; e.push(s); }
  const wb = Math.max(1,Math.round(win/blk)); let best=0, bestS=-1, cur=0;
  for(let i=0;i<e.length;i++){ cur+=e[i]; if(i>=wb) cur-=e[i-wb]; if(i>=wb-1 && cur>bestS){ bestS=cur; best=i-wb+1; } }
  let start = Math.max(0,best*blk); if(start+win>n) start=Math.max(0,n-win);
  let pk=0; for(let j=start;j<start+win;j++){ const a=Math.abs(d[j]); if(a>pk) pk=a; }
  return {buf, start:start/sr, dur:win/sr, gain: pk>0 ? Math.min(6,.9/pk) : 1};
}
async function loadReal(){
  if(realStarted) return; realStarted = true;
  await Promise.all(Object.entries(REAL).map(async ([id,r])=>{
    try{
      const resp = await fetch(W+r.u); if(!resp.ok) return;
      REALBUF[id] = prepare(await decode(await resp.arrayBuffer()), r.max);
    }catch(e){ /* sem internet: fica o som sintetizado */ }
  }));
}
function playReal(id){
  const r = REALBUF[id], c = REAL[id], reps = c.rep||1;
  for(let k=0;k<reps;k++){
    const t0 = AC.currentTime + k*(r.dur+.2);
    const s = AC.createBufferSource(); s.buffer = r.buf;
    const g = AC.createGain(), fi=.03, fo=Math.min(.25,r.dur/3);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(r.gain,t0+fi);
    g.gain.setValueAtTime(r.gain,t0+r.dur-fo);
    g.gain.linearRampToValueAtTime(0,t0+r.dur);
    s.connect(g); g.connect(master);
    s.start(t0,r.start,r.dur);
  }
}

let speakId = 0;
/* Diz o texto e, SÓ QUANDO TERMINA, chama 'then' (ex.: tocar o som do animal).
   Se a voz não existir ou falhar, 'then' é chamado na mesma, após um curto tempo. */
function speak(text, then){
  const id = ++speakId;
  let done = false;
  const fin = ()=>{ if(done) return; done = true; if(then && id===speakId) then(); };
  try{
    if(!("speechSynthesis" in window)){ setTimeout(fin,300); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-PT"; u.rate = .85; u.pitch = 1.25;
    const v = speechSynthesis.getVoices().find(v=>/pt[-_]PT/i.test(v.lang)) ||
              speechSynthesis.getVoices().find(v=>/^pt/i.test(v.lang));
    if(v) u.voice = v;
    u.onend = ()=>setTimeout(fin,150);
    u.onerror = ()=>fin();
    speechSynthesis.speak(u);
    setTimeout(fin, 4000);          // segurança (alguns aparelhos não avisam quando acaba)
  }catch(e){ setTimeout(fin,300); }
}

    const c = document.createElement("canvas"); c.width = c.height = 40;
    const x = c.getContext("2d"); x.font = "30px sans-serif"; x.textBaseline = "top";
    x.fillText(ch,2,2); const a = x.getImageData(0,0,40,40).data;

    let colored = 0;

      if(a[i+3]>200 && Math.max(a[i],a[i+1],a[i+2])-Math.min(a[i],a[i+1],a[i+2])>35) colored++;

  const pic = (a.id==="burro" && !DONKEY_EMOJI_OK) ? DONKEY_SVG : a.e;
  d.innerHTML = `<span class="e">${pic}</span><span class="n">${a.n}</span>`;
  d.dataset.id = a.id;
  return d;
}

/* Animação de cada animal + partículas (começa quando o som toca) */
const FX = {
  vaca:{an:"sway",   p:["🌿","🎵","🍀"]},
  cao:{an:"hop",     p:["🦴","🎵","💛"]},
  gato:{an:"stretch",p:["💖","🐾","✨"]},
  ovelha:{an:"fluff",p:["☁️","🎵","🌼"]},
  porco:{an:"wiggle",p:["💗","🌸","🎵"]},
  galo:{an:"crow",   p:["☀️","🎵","✨"]},
  pato:{an:"waddle", p:["💧","🫧","🎵"]},
  cavalo:{an:"gallop",p:["💨","🎵","⭐"]},
  burro:{an:"headshake",p:["🎵","🥕","💨"]},
  leao:{an:"roar",   p:["⭐","💥","🔥"]},
  elefante:{an:"trumpet",p:["💦","🎺","🎵"]},
  macaco:{an:"swing",p:["🍌","🎵","🌴"]},
  ra:{an:"leap",     p:["💧","🫧","🍃"]},
  passaro:{an:"fly",  p:["🎵","🎶","🪶"]},
  peru:{an:"puff",    p:["🍂","🎵","🌾"]},
  coelho:{an:"hop",   p:["🥕","💗","🌸"]},
};
function animate(c,a){
  const f = FX[a.id]; if(!f || !c.isConnected) return;
  const e = c.querySelector(".e");
  e.className = "e"; void e.offsetWidth; e.classList.add("an-"+f.an);
  c.classList.add("playing"); setTimeout(()=>c.classList.remove("playing"),2000);
  const ring = document.createElement("div"); ring.className = "ring"; c.appendChild(ring);
  setTimeout(()=>ring.remove(),1200);
  const r = c.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height*.4;
  for(let i=0;i<9;i++) setTimeout(()=>{
    if(!c.isConnected) return;
    const s = document.createElement("div"); s.className = "fx";
    s.textContent = f.p[i%f.p.length];
    s.style.left = (cx+(Math.random()-.5)*r.width*.6)+"px"; s.style.top = cy+"px";
    s.style.setProperty("--dx",((Math.random()-.5)*160)+"px");
    s.style.setProperty("--dy",(-60-Math.random()*110)+"px");
    s.style.setProperty("--rot",((Math.random()-.5)*60)+"deg");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1600);
  }, i*160);
}
function bounce(el){ el.classList.remove("bounce"); void el.offsetWidth; el.classList.add("bounce"); }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function confetti(){
  const set = ["🎉","⭐","🌟","🎈","✨","🐾"];
  for(let i=0;i<22;i++){
    const c = document.createElement("div");
    c.className = "conf"; c.textContent = set[i%set.length];
    c.style.left = Math.random()*100+"vw";
    c.style.animationDelay = Math.random()*.5+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2600);
  }
}

/* Modo 4 – Encontra-nos! Procurar a Benedita / a Mafalda escondidas numa cena cheia de coisas */
const HUNT_STICKERS = ["🐮","🐶","🐱","🐑","🐷","🐓","🦆","🐴","🦁","🐘","🐵","🐸","🐦","🦃","🐰",
                       "🌳","🌸","🌻","🍎","🍓","🎈","⭐","🦋","🐝","🐞","🍄","🌈","☀️","🥕","🍌","🎵","🐾"];
const HUNT_LEVELS = {1:{n:8,d:.17}, 2:{n:20,d:.12}, 3:{n:34,d:.09}, 4:{n:50,d:.075}};
let huntStep = 0, huntDone = false, huntW = 0;

function mode4(){
  const me = PLAYERS[player] ? player : "benedita";
  const other = me==="benedita" ? "mafalda" : "benedita";
  const tid = huntStep%2===0 ? other : me;                 // primeiro procura a irmã, depois procura-se a si
  const level = Math.min(4, 1+Math.floor(huntStep/2));    // sobe a dificuldade de 2 em 2 achados
  const cfg = HUNT_LEVELS[level];
  const tname = PLAYERS[tid].nome;
  const ask = tid===me ? "Onde estás tu, "+tname+"?" : "Onde está a "+tname+"?";
  huntDone = false;

  grid.className = "scene-wrap"; grid.innerHTML = "";
  prompt_.innerHTML = `<img class="mini" src="${PLAYERS[tid].foto}" alt=""> ${ask} <button class="btn" id="again">🔊</button> <button class="btn" id="hint">💡 Dica</button>`;
  const scene = document.createElement("div"); scene.className = "scene"; grid.appendChild(scene);

  const W = Math.max(240, scene.clientWidth);
  const top = scene.getBoundingClientRect().top;
  const H = Math.round(Math.max(260, Math.min(W*.85, window.innerHeight - top - 24)));
  scene.style.height = H+"px"; huntW = W;
  const d = Math.max(46, Math.round(cfg.d*W));
  const n = Math.round(cfg.n*Math.min(1,(W*H)/(700*560))) + 6;
  const rnd = (a,b)=>a+Math.random()*(b-a), m = d*.6;
  const rx = ()=>rnd(m,W-10-m), ry = ()=>rnd(m,H-10-m);

  // posições das duas caras (afastadas uma da outra)
  let fa = {x:rx(),y:ry()}, fb = {x:rx(),y:ry()};
  for(let i=0;i<80 && Math.hypot(fa.x-fb.x,fa.y-fb.y) < W*.3;i++) fb = {x:rx(),y:ry()};
  const ids = shuffle(["benedita","mafalda"]);
  const faces = [{id:ids[0],x:fa.x,y:fa.y},{id:ids[1],x:fb.x,y:fb.y}];

  // coisas à volta (nunca por cima do centro de uma cara, para não a esconderem toda)
  const stks = [];
  for(let i=0;i<n;i++){
    const size = Math.max(30, Math.round(d*rnd(.8,1.3)));
    let p = {x:rx(),y:ry()};
    for(let t=0;t<80;t++){
      p = {x:rx(),y:ry()};
      const farFaces = faces.every(f=>Math.hypot(f.x-p.x,f.y-p.y) >= d*.62);
      const farStk = level>1 || stks.every(s=>Math.hypot(s.x-p.x,s.y-p.y) >= (s.size+size)*.55);
      if(farFaces && farStk) break;
    }
    const e = document.createElement("div"); e.className = "stk"; e.textContent = HUNT_STICKERS[Math.floor(Math.random()*HUNT_STICKERS.length)];
    e.style.cssText = `left:${p.x-size/2}px;top:${p.y-size/2}px;width:${size}px;height:${size}px;line-height:${size}px;font-size:${Math.round(size*.8)}px;z-index:${1+Math.floor(Math.random()*5)};transform:rotate(${Math.round(rnd(-25,25))}deg)`;
    scene.appendChild(e); stks.push({x:p.x,y:p.y,size});
  }

  let misses = 0, hinted = false;
  const faceEls = {};
  faces.forEach(f=>{
    const e = document.createElement("div"); e.className = "face"+(f.id==="mafalda"?" m":"");
    e.style.cssText = `left:${f.x-d/2}px;top:${f.y-d/2}px;width:${d}px;height:${d}px`;
    e.innerHTML = `<img src="${PLAYERS[f.id].foto}" alt="">`;
    e.onclick = ev=>{
      ev.stopPropagation(); if(huntDone) return; initAudio();
      if(f.id===tid) return found(e);
      e.classList.remove("nope"); void e.offsetWidth; e.classList.add("nope");
      speak("Essa é a "+PLAYERS[f.id].nome+"! Continua a procurar!");
    };
    scene.appendChild(e); faceEls[f.id] = e;
  });

  function showHint(){
    if(huntDone) return; hinted = true;
    const f = faces.find(x=>x.id===tid), r = d*1.9;
    const ring = document.createElement("div"); ring.className = "hintring";
    ring.style.cssText = `left:${f.x-r/2}px;top:${f.y-r/2}px;width:${r}px;height:${r}px`;
    scene.appendChild(ring); setTimeout(()=>ring.remove(),3400);
  }
  function found(e){
    huntDone = true; e.classList.add("found");
    sfxWin(); confetti(); addStar();
    speak(tid===me ? "Encontraste-te, "+tname+"! Muito bem!" : "Encontraste a "+tname+"! Muito bem!");
    setTimeout(()=>{ if(mode===4){ huntStep++; mode4(); } }, 4500);
  }
  scene.onclick = ev=>{                                    // tocou noutro sítio: tenta outra vez
    if(huntDone) return; initAudio();
    const r = scene.getBoundingClientRect();
    const ring = document.createElement("div"); ring.className = "missring";
    ring.style.left = (ev.clientX-r.left)+"px"; ring.style.top = (ev.clientY-r.top)+"px";
    scene.appendChild(ring); setTimeout(()=>ring.remove(),600);
    sfxOops(); misses++;
    if(misses===3) speak("Quase! Procura bem!");
    if(misses>=5 && !hinted) showHint();
  };
  document.getElementById("again").onclick = ()=>{ initAudio(); speak(ask); };
  document.getElementById("hint").onclick = ()=>{ initAudio(); showHint(); };
  setTimeout(()=>speak(ask),350);
}
let huntResizeT = null;
window.addEventListener("resize", ()=>{                    // só volta a desenhar se a largura mudou mesmo (rodar o iPad)
  if(mode!==4 || huntDone) return;
  clearTimeout(huntResizeT);
  huntResizeT = setTimeout(()=>{
    const s = document.querySelector(".scene");
    if(s && Math.abs(s.clientWidth - huntW) > 40) mode4();
  },300);
});


/* ───────────────────────── JOGO 5: CONTA ATÉ 10 ───────────────────────── */
const NUMW = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez"];
const NUMC = ["#ff7a59","#4cc38a","#5b8def","#a867d8","#1fa6b8","#e8590c","#d6336c","#37b24d","#f59f00","#7048e8"];
const COUNT_THINGS = ["🍎","🍓","🐥","🐞","⭐","🎈","🐟","🌸","🐮","🍌","🦋","🐝"];
let countStep = 0, countRun = 0;

function mode5(){
  const run = ++countRun;                       // cancela contagens automáticas anteriores
  const max = Math.min(10, 3 + Math.floor(countStep/2));   // começa em 3 e sobe até 10
  const kind = countStep%2===0 ? "count" : "give";
  const N = 1 + Math.floor(Math.random()*max);
  const thing = COUNT_THINGS[Math.floor(Math.random()*COUNT_THINGS.length)];
  let done = false;
  grid.className = "count-wrap"; grid.innerHTML = "";

  const finish = (txt)=>{
    done = true; sfxWin(); confetti(); addStar();
    speak("Muito bem! "+txt);
    setTimeout(()=>{ if(mode===5 && run===countRun){ countStep++; mode5(); } }, 4200);
  };
  const mk = (cls)=>{ const e = document.createElement("div"); e.className = cls; return e; };
  const item = ()=>{ const e = mk("cit"); e.innerHTML = thing+'<span class="bd"></span>'; return e; };

  if(kind==="count"){
    const ask = "Quantos são? Toca em cada um para contar.";
    prompt_.innerHTML = `Quantos são? <button class="btn" id="again">🔊</button> <button class="btn" id="auto">👆 Conta comigo</button>`;
    const box = mk("cbox"); grid.appendChild(box);
    const its = [];
    let counted = 0;
    const mark = (e,k)=>{ e.classList.add("on"); e.querySelector(".bd").textContent = k; bounce(e); };
    for(let i=0;i<N;i++){
      const e = item(); e.onclick = ()=>{
        if(done) return; initAudio();
        if(e.classList.contains("on")) return;
        counted++; mark(e,counted); speak(NUMW[counted]);
      };
      box.appendChild(e); its.push(e);
    }
    const ch = mk("choices"); grid.appendChild(ch);
    const opts = [N]; 
    while(opts.length<3){ const v = 1+Math.floor(Math.random()*Math.max(4,max)); if(opts.indexOf(v)<0) opts.push(v); }
    shuffle(opts).forEach(v=>{
      const b = document.createElement("button"); b.className = "num"; b.textContent = v; b.style.background = NUMC[(v-1)%10];
      b.onclick = ()=>{
        if(done) return; initAudio();
        if(v===N){ b.classList.add("good"); finish("São "+NUMW[N]+"!"); }
        else{ shake(b); sfxOops(); speak("Tenta outra vez! Conta com calma."); }
      };
      ch.appendChild(b);
    });
    document.getElementById("again").onclick = ()=>{ initAudio(); speak(ask); };
    document.getElementById("auto").onclick = ()=>{
      initAudio(); if(done) return;
      its.forEach(e=>{ e.classList.remove("on"); }); counted = 0;
      const step = ()=>{
        if(done || run!==countRun || counted>=N) return;
        const e = its[counted]; counted++; mark(e,counted);
        speak(NUMW[counted], step);
      };
      step();
    };
    setTimeout(()=>{ if(run===countRun) speak(ask); },350);
  }else{
    const ask = "Põe "+NUMW[N]+" no prato!";
    prompt_.innerHTML = `Põe <span class="big">${N}</span> no prato! <button class="btn" id="again">🔊</button>`;
    const src = mk("cbox"); grid.appendChild(src);
    const plate = mk("plate"); grid.appendChild(plate);
    let put = 0;
    const total = Math.min(12, N+2+Math.floor(Math.random()*3));
    for(let i=0;i<total;i++){
      const e = item();
      e.onclick = ()=>{
        if(done) return; initAudio();
        if(e.parentNode!==src) return;
        if(put>=N){ bounce(e); speak("Já chegam! Tens "+NUMW[N]+"."); return; }
        put++; src.removeChild(e); e.classList.add("on"); e.querySelector(".bd").textContent = put; plate.appendChild(e);
        if(put===N) finish(NUMW[N]+"!"); else speak(NUMW[put]);
      };
      src.appendChild(e);
    }
    document.getElementById("again").onclick = ()=>{ initAudio(); speak(ask); };
    setTimeout(()=>{ if(run===countRun) speak(ask); },350);
  }
}


/* ───────────────────────── JOGO 6: AS CORES ───────────────────────── */
const COLORS = [
  {n:"vermelho",h:"#e53935"},{n:"amarelo",h:"#fdd835"},{n:"azul",h:"#1e88e5"},{n:"verde",h:"#43a047"},
  {n:"laranja",h:"#fb8c00"},{n:"rosa",h:"#f48fb1"},{n:"roxo",h:"#8e24aa"},{n:"castanho",h:"#8d5a2b"}];
const COLOR_THINGS = [
  {e:"🍎",t:"a maçã",c:"vermelho"},{e:"🍅",t:"o tomate",c:"vermelho"},{e:"🍌",t:"a banana",c:"amarelo"},{e:"🌻",t:"o girassol",c:"amarelo"},
  {e:"💧",t:"a gota de água",c:"azul"},{e:"🐸",t:"a rã",c:"verde"},{e:"🥦",t:"o brócolo",c:"verde"},{e:"🍊",t:"a laranja",c:"laranja"},
  {e:"🥕",t:"a cenoura",c:"laranja"},{e:"🐷",t:"o porquinho",c:"rosa"},{e:"🍆",t:"a beringela",c:"roxo"},{e:"🐻",t:"o urso",c:"castanho"}];
let colorStep = 0, colorLast = "";

function mode6(){
  const k = Math.min(8, 3 + Math.floor(colorStep/2));          // começa com 3 cores e vai juntando mais
  const pool = COLORS.slice(0,k).map(c=>c.n);
  const nOpts = Math.min(4, 2 + Math.ceil(k/3));
  const mine = shuffle(COLOR_THINGS.filter(x=>pool.indexOf(x.c)>=0));
  const kind = (colorStep%2===1 && mine.length) ? "obj" : "tap";
  const hex = nm=>COLORS.filter(c=>c.n===nm)[0].h;
  let tc, thing = null, done = false;
  if(kind==="obj"){ thing = mine[0]; tc = thing.c; }
  else{ do{ tc = pool[Math.floor(Math.random()*pool.length)]; }while(tc===colorLast && pool.length>1); colorLast = tc; }
  const opts = [tc]; shuffle(pool.slice()).forEach(n=>{ if(opts.length<nOpts && opts.indexOf(n)<0) opts.push(n); });

  grid.className = "color-wrap"; grid.innerHTML = "";
  const ask = kind==="obj" ? "De que cor é "+thing.t+"?" : "Toca no "+tc+"!";
  prompt_.innerHTML = (kind==="obj" ? "De que cor é "+thing.t+"?" : "Toca no <b style=\"color:"+(tc==="amarelo"?"#c9a400":hex(tc))+"\">"+tc+"</b>!")+' <button class="btn" id="again">🔊</button>';
  if(kind==="obj"){
    const o = document.createElement("div"); o.className = "cobj";
    o.innerHTML = '<div class="e2">'+thing.e+'</div><div class="n2">'+thing.t.charAt(0).toUpperCase()+thing.t.slice(1)+'</div>';
    grid.appendChild(o);
  }
  const ch = document.createElement("div"); ch.className = "choices"; grid.appendChild(ch);
  shuffle(opts).forEach(nm=>{
    const b = document.createElement("div"); b.className = "sw"; b.style.background = hex(nm);
    b.setAttribute("role","button"); b.setAttribute("aria-label",nm);
    b.onclick = ()=>{
      if(done) return; initAudio();
      if(nm===tc){
        done = true; b.classList.add("good"); sfxWin(); confetti(); addStar();
        speak("Muito bem! É "+tc+"!");
        setTimeout(()=>{ if(mode===6){ colorStep++; mode6(); } }, 4000);
      }else{ shake(b); sfxOops(); speak("Isso é "+nm+". Tenta outra vez!"); }
    };
    ch.appendChild(b);
  });
  document.getElementById("again").onclick = ()=>{ initAudio(); speak(ask); };
  setTimeout(()=>{ if(mode===6 && !done) speak(ask); },350);
}

  grid.className = "menu-wrap";
  prompt_.innerHTML = 'Escolhe uma história 📖 <button class="btn" id="hm">🏠 Menu</button>';
  grid.innerHTML = STORIES.map((st,i)=>'<button class="bigbtn story" data-i="'+i+'" style="background:#f59f00"><span class="bi">'+st.capa+'</span>'+st.titulo+'</button>').join("");
  Array.prototype.forEach.call(grid.querySelectorAll(".bigbtn"), b=>b.onclick = ()=>{ initAudio(); openStory(parseInt(b.dataset.i,10),0); });
  document.getElementById("hm").onclick = ()=>{ initAudio(); showMenu("O que queres fazer?"); };
  speak("Escolhe uma história!");
}
function openStory(si,pg){
  leaveSection(); section = "stories";
  const st = STORIES[si], P = st.pages[pg], last = pg===st.pages.length-1;
  grid.className = "story-wrap";
  prompt_.innerHTML = '<button class="btn" id="hm">🏠 Menu</button> <span class="pg">'+st.titulo+' · '+(pg+1)+'/'+st.pages.length+'</span>';
  grid.innerHTML =
    '<div class="story" style="background:'+P.bg+'">'+
      '<div class="chars"><img src="benedita.jpg" alt="Benedita"><img class="m" src="mafalda.jpg" alt="Mafalda"></div>'+
      '<div>'+P.e.map(x=>'<span class="sit">'+x+'</span>').join("")+'</div>'+
      '<div class="stext">'+P.t+'</div>'+
    '</div>'+
    '<div class="sctl"><button class="btn" id="sp"'+(pg===0?' disabled':'')+'>◀</button>'+
    '<button class="btn" id="sl">🔊 Ouvir</button>'+
    '<button class="btn" id="sn">'+(last?'🔁 Ler outra vez':'Seguinte ▶')+'</button></div>';
  const spoken = P.t.replace(/—\s*/g,"");
  Array.prototype.forEach.call(grid.querySelectorAll(".sit"), e=>e.onclick = ()=>{
    initAudio(); bounce(e);
    voice({type:"sine",f:[[0,450+Math.random()*250],[.12,900]],dur:.16,vol:.25});
  });
  document.getElementById("hm").onclick = ()=>{ initAudio(); showMenu("O que queres fazer?"); };
  document.getElementById("sl").onclick = ()=>{ initAudio(); speak(spoken); };
  document.getElementById("sp").onclick = ()=>{ initAudio(); if(pg>0) openStory(si,pg-1); };
  document.getElementById("sn").onclick = ()=>{ initAudio(); openStory(si, last?0:pg+1); };
  if(last){ sfxWin(); confetti(); if(!st.done){ st.done = true; addStar(); } }
  setTimeout(()=>speak(spoken),350);
}

function answer(el,a,next){
  if(locked) return;
  initAudio();
  if(a===target){
    locked = true;
    el.classList.add("good"); el.classList.remove("hide-name"); bounce(el);
    sfxWin(); confetti(); addStar();
    // "Muito bem!" + nome, e só depois o som do animal
    setTimeout(()=>speak("Muito bem! "+a.n, ()=>{ SOUNDS[a.s](); animate(el,a); }), 500);
    const m = mode;
    setTimeout(()=>{ if(mode===m) next(); },6500);
  }else{
    shake(el); sfxOops();
    speak("Tenta outra vez!");
  }
}

function setMode(m){
  mode = m;
  ["m1","m2","m3","m4","m5","m6"].forEach((id,i)=>document.getElementById(id).classList.toggle("on",i+1===m));
  ({1:mode1,2:mode2,3:mode3,4:mode4,5:mode5,6:mode6})[m]();
}
["m1","m2","m3","m4","m5","m6"].forEach((id,i)=>document.getElementById(id).onclick = ()=>{ initAudio(); setMode(i+1); });

/* Escolher quem joga: mostra a foto em cima com "Olá! Eu sou a ..." e a voz diz o mesmo */
function choosePlayer(id){
  initAudio();
  const p = PLAYERS[id]; player = id;
  document.getElementById("start").style.display = "none";
  document.getElementById("pPhoto").src = p.foto;
  document.getElementById("pPhoto").alt = p.nome;
  document.getElementById("pName").textContent = "Eu sou a "+p.nome+"!";
  const btn = document.getElementById("player");
  btn.classList.remove("hi"); void btn.offsetWidth; btn.classList.add("hi");
  loadStars(); drawStars(); huntStep = 0; countStep = 0; colorStep = 0; STORIES.forEach(x=>{ x.done = false; });
  sfxWin(); confetti();
  showMenu("Olá! Eu sou a "+p.nome+"! O que queres fazer? Jogos ou histórias?");
}
document.querySelectorAll(".who").forEach(b=>b.onclick = ()=>choosePlayer(b.dataset.p));
/* tocar na foto em cima volta ao ecrã "Quem vai jogar?" */
document.getElementById("player").onclick = ()=>{
  try{ speechSynthesis.cancel(); }catch(e){}
  speakId++;
  document.getElementById("start").style.display = "flex";
};

document.getElementById("credits").innerHTML = Object.entries(REAL).map(([id,r])=>{
  const a = byId[id];
  const link = "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(r.t.replace(/ /g,"_"));
  return `<li>${a.e} <a href="${link}" target="_blank" rel="noopener">${r.t.replace(/</g,"&lt;")}</a> — ${r.by.replace(/</g,"&lt;")}, ${r.lic}</li>`;
}).join("");

drawStars();
showMenu();   // o menu fica por trás do ecrã "Quem vai jogar?" até alguém escolher
</script>
</body>
