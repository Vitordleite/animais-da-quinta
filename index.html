<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jogos das Pequenitas 🐮</title>
<style>
  :root{
    --bg1:#bfe9ff; --bg2:#e9fbd3; --card:#ffffff; --ink:#3a2f5b;
    --a:#ff7a59; --b:#ffc83d; --c:#4cc38a; --d:#5b8def;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%}
  body{
    font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    min-height:100vh; overflow-x:hidden;
  }
  header{text-align:center;padding:14px 10px 4px}
  h1{margin:0;font-size:36px;font-size:clamp(26px,6vw,46px);letter-spacing:1px}
  .stars{font-size:24px;font-size:clamp(20px,4vw,28px);min-height:34px}
  nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 10px}
  nav button, .btn{
    font:inherit;font-size:19px;font-size:clamp(16px,3.6vw,22px);font-weight:bold;
    border:none;border-radius:999px;padding:12px 22px;cursor:pointer;color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s;
  }
  nav button:active,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #m1{background:var(--a)} #m2{background:var(--c)} #m3{background:var(--d)}
  nav button.on{outline:5px solid #fff;outline-offset:2px}
  .prompt{text-align:center;font-size:26px;font-size:clamp(20px,4.5vw,32px);margin:8px 10px;min-height:46px}
  .prompt .btn{background:var(--b);color:var(--ink);margin-left:8px;padding:8px 18px}
  main{
    display:grid;grid-gap:14px;gap:14px;padding:10px 14px 30px;max-width:980px;margin:0 auto;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  }
  main.few{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-width:760px}
  .card{
    background:var(--card);border-radius:28px;padding:10px 6px 12px;text-align:center;cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.12);border:5px solid transparent;
    transition:transform .1s;
  }
  .card:active{transform:scale(.94)}
  .card .e{font-size:77px;font-size:clamp(58px,15vw,96px);line-height:1.1;display:block}
  .card .n{font-size:19px;font-size:clamp(16px,3.6vw,22px);font-weight:bold}
  .card.hide-name .n{visibility:hidden}
  .bounce{animation:bounce .7s}
  @keyframes bounce{
    0%{transform:scale(1)} 20%{transform:scale(1.18) rotate(-6deg)}
    40%{transform:scale(.95) rotate(5deg)} 60%{transform:scale(1.12) rotate(-4deg)}
    80%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1)}
  }
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .good{border-color:var(--c)}

  /* ── animações dos animais ── */
  .card{position:relative}
  .card .e{display:block;width:fit-content;margin:0 auto;transform-origin:50% 80%}
  .card .e svg{width:1em;height:1em;vertical-align:-.12em}
  .card.playing{border-color:var(--b);box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 6px rgba(255,200,61,.35)}
  .ring{position:absolute;left:50%;top:42%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
        border:5px solid var(--b);opacity:.8;pointer-events:none;animation:ring 1.1s ease-out forwards}
  @keyframes ring{to{transform:scale(5);opacity:0}}
  .fx{position:fixed;z-index:15;pointer-events:none;font-size:28px;font-size:clamp(22px,5vw,34px);transform:translate(-50%,-50%);
      animation:fx 1.5s ease-out forwards}
  @keyframes fx{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}
                to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot))}}
  .an-sway{animation:sway 2s ease-in-out}
  @keyframes sway{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) translateX(-8px)}35%{transform:rotate(12deg) translateX(8px)}55%{transform:rotate(-9deg)}75%{transform:rotate(7deg)}}
  .an-hop{animation:hop 1.8s ease-in-out}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:scale(1.15,.85)}25%{transform:translateY(-34px) scale(.92,1.1)}40%,60%{transform:translateY(0) scale(1.12,.88)}75%{transform:translateY(-34px) scale(.92,1.1)}}
  .an-stretch{animation:stretch 1.8s ease-in-out}
  @keyframes stretch{0%,100%{transform:scale(1,1)}20%{transform:scale(1.3,.78)}45%{transform:scale(.82,1.28) translateY(-6px)}70%{transform:scale(1.15,.9)}}
  .an-fluff{animation:fluff 1.8s ease-in-out}
  @keyframes fluff{0%,100%{transform:scale(1) rotate(0)}20%{transform:scale(1.2) rotate(-6deg)}40%{transform:scale(.95) rotate(5deg)}60%{transform:scale(1.18) rotate(-4deg)}80%{transform:scale(1.02)}}
  .an-wiggle{animation:wiggle 1.6s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-16deg)}20%{transform:rotate(16deg)}30%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(14deg)}55%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
  .an-crow{animation:crow 2.2s ease-in-out}
  @keyframes crow{0%,100%{transform:translateY(0) rotate(0) scale(1)}20%,70%{transform:translateY(-12px) rotate(-14deg) scale(1.25)}30%,60%{transform:translateY(-12px) rotate(-8deg) scale(1.3)}}
  .an-waddle{animation:waddle 1.8s ease-in-out}
  @keyframes waddle{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-10px) rotate(-10deg)}25%{transform:translateX(10px) rotate(10deg)}38%{transform:translateX(-10px) rotate(-10deg)}50%{transform:translateX(10px) rotate(10deg)}65%{transform:translateX(-6px) rotate(-6deg)}80%{transform:translateX(6px) rotate(6deg)}}
  .an-gallop{animation:gallop 1.8s ease-in-out}
  @keyframes gallop{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-14px,-10px) rotate(-8deg)}20%{transform:translate(14px,0) rotate(6deg)}30%{transform:translate(-14px,-10px) rotate(-8deg)}40%{transform:translate(14px,0) rotate(6deg)}55%{transform:translate(-8px,-16px) rotate(-14deg) scale(1.15)}75%{transform:translate(0,0) rotate(0)}}
  .an-headshake{animation:headshake 1.8s ease-in-out}
  @keyframes headshake{0%,100%{transform:rotate(0)}8%{transform:rotate(-18deg) scale(1.1)}16%{transform:rotate(18deg)}24%{transform:rotate(-18deg)}32%{transform:rotate(18deg)}40%{transform:rotate(-14deg) translateY(-8px)}55%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}85%{transform:rotate(6deg)}}
  .an-roar{animation:roar 2.2s ease-in-out}
  @keyframes roar{0%,100%{transform:scale(1)}15%{transform:scale(1.45) translateY(-6px)}22%{transform:scale(1.45) translate(-6px,-6px)}29%{transform:scale(1.45) translate(6px,-6px)}36%{transform:scale(1.45) translate(-6px,-6px)}43%{transform:scale(1.45) translate(6px,-6px)}50%{transform:scale(1.45) translate(-4px,-6px)}60%{transform:scale(1.4)}85%{transform:scale(1.1)}}
  .an-trumpet{animation:trumpet 2s ease-in-out}
  @keyframes trumpet{0%,100%{transform:rotate(0) scale(1)}25%,65%{transform:rotate(-16deg) scale(1.3) translateY(-10px)}35%,55%{transform:rotate(-20deg) scale(1.36) translateY(-12px)}}
  .an-swing{animation:swing 2s ease-in-out;transform-origin:50% -25%!important}
  @keyframes swing{0%,100%{transform:rotate(0)}20%{transform:rotate(30deg)}40%{transform:rotate(-30deg)}60%{transform:rotate(24deg)}80%{transform:rotate(-14deg)}}
  .an-leap{animation:leap 1.8s ease-in-out}
  @keyframes leap{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:scale(1.25,.7)}35%{transform:translateY(-62px) scale(.85,1.2) rotate(-10deg)}55%{transform:translateY(0) scale(1.25,.72)}70%{transform:translateY(-30px) scale(.92,1.1) rotate(8deg)}85%{transform:translateY(0) scale(1.1,.9)}}
  .an-fly{animation:fly 2s ease-in-out}
  @keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(26px,-34px) rotate(14deg)}45%{transform:translate(0,-56px) rotate(0) scale(1.1)}70%{transform:translate(-26px,-30px) rotate(-14deg)}}
  .an-puff{animation:puff 2s ease-in-out}
  @keyframes puff{0%,100%{transform:scale(1)}20%{transform:scale(1.4)}30%{transform:scale(1.32) rotate(-6deg)}40%{transform:scale(1.42) rotate(6deg)}50%{transform:scale(1.34) rotate(-5deg)}65%{transform:scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.card .e{animation-duration:.01s!important}.fx,.ring{display:none}}
  .conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.8s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
  footer{text-align:center;font-size:13px;opacity:.6;padding:0 0 18px}
  #start{
    position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;
  }
  #start .ask{font-size:35px;font-size:clamp(26px,7vw,44px);font-weight:bold}
  .who-row .who{margin:8px}
  nav button{margin:4px}
  .player img{margin-right:6px}
  .who-row{display:flex;gap:27px;gap:clamp(14px,5vw,40px);justify-content:center;flex-wrap:wrap}
  .who{font:inherit;border:none;background:#fff;border-radius:32px;padding:14px 14px 12px;cursor:pointer;
       box-shadow:0 8px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:8px;
       font-size:28px;font-size:clamp(22px,6vw,34px);font-weight:bold;color:var(--ink);transition:transform .1s}
  .who:active{transform:translateY(5px) scale(.97);box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .who img{width:175px;width:clamp(130px,34vw,220px);height:175px;height:clamp(130px,34vw,220px);border-radius:50%;object-fit:cover;
           border:6px solid var(--b);animation:bounce 2.4s infinite}
  .who:nth-child(2) img{border-color:var(--a);animation-delay:.6s}
  /* barra da jogadora, em cima */
  .player{font:inherit;color:var(--ink);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:0}
  .player img{width:78px;width:clamp(64px,16vw,92px);height:78px;height:clamp(64px,16vw,92px);border-radius:50%;object-fit:cover;border:5px solid var(--b);
              box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .player .bubble{background:#fff;border-radius:22px;padding:8px 18px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12);
                  font-size:24px;font-size:clamp(18px,4.6vw,30px);line-height:1.15;position:relative}
  /* depois de entrar: cabeçalho compacto, foto + nome à esquerda */
  header{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px 2px;max-width:980px;margin:0 auto}
  header .sub{flex:1;text-align:center;font-size:16px;font-size:clamp(13px,2.6vw,18px);opacity:.7}
  header .stars{font-size:19px;font-size:clamp(16px,3.4vw,22px);min-height:0;white-space:nowrap}
  .player{gap:8px;flex:none}
  .player img{width:51px;width:clamp(44px,10vw,58px);height:51px;height:clamp(44px,10vw,58px);border-width:3px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .player .bubble{padding:5px 12px;border-radius:16px;font-size:16px;font-size:clamp(13px,3.2vw,18px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
  header .player .bubble::before{left:-7px;margin-top:-7px;border-width:7px;border-left-width:0}
  @media (max-width:560px){header .sub{display:none}header{justify-content:space-between}}
  .player .bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
  .player.hi img{animation:bounce .9s 2}
</style>
</head>
<body>

<div id="start">
  <h1>Jogos das Pequenitas</h1>
  <div class="ask">Quem vai jogar? 💖</div>
  <div class="who-row">
    <button class="who" data-p="benedita"><img src="benedita.jpg" alt="Benedita"><span>Benedita</span></button>
    <button class="who" data-p="mafalda"><img src="mafalda.jpg" alt="Mafalda"><span>Mafalda</span></button>
  </div>
</div>

<header>
  <button id="player" class="player" title="Trocar de jogadora">
    <img id="pPhoto" alt="">
    <span class="bubble"><b id="pHi">Olá!</b> <span id="pName"></span></span>
  </button>
  <div class="sub">Jogos das Pequenitas · Os Animais da Quinta</div>
  <div class="stars" id="stars"></div>
</header>

<nav>
  <button id="m1" class="on">👆 Toca e ouve</button>
  <button id="m2">👂 Que animal é?</button>
  <button id="m3">🔎 Onde está?</button>
</nav>

<div class="prompt" id="prompt"></div>
<main id="grid"></main>
<footer>
  Feito com ❤️ para a Benedita e a Mafalda<br>
  <details style="max-width:760px;margin:6px auto;text-align:left">
    <summary style="cursor:pointer;text-align:center">Créditos dos sons</summary>
    <p>Gravações do <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>, cortadas e com o volume ajustado. O coelho é um som sintetizado.</p>
    <ul id="credits"></ul>
  </details>
</footer>

<script>
"use strict";

/* ───────────────────────── ÁUDIO (tudo sintetizado, sem ficheiros) ───────────────────────── */
let AC = null, master = null;
function initAudio(){
  if(AC) { if(AC.state==="suspended") AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
  if(typeof loadReal==="function") loadReal();
}

/* oscilador com envolvente de frequência [[t,hz],...], filtro e vibrato */
function voice({type="sawtooth",f,dur,at=0,vol=.3,filt=null,vib=null,trem=null,att=.02,rel=.08}){
  const t0 = AC.currentTime + at;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f[0][1], t0+f[0][0]);
  for(let i=1;i<f.length;i++) o.frequency.linearRampToValueAtTime(f[i][1], t0+f[i][0]);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.setValueAtTime(vol,t0+Math.max(att,dur-rel));
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  let node = o;
  if(filt){
    const bq = AC.createBiquadFilter(); bq.type = filt.type||"bandpass";
    bq.frequency.setValueAtTime(filt.f[0][1],t0);
    for(let i=1;i<filt.f.length;i++) bq.frequency.linearRampToValueAtTime(filt.f[i][1],t0+filt.f[i][0]);
    bq.Q.value = filt.q||2;
    node.connect(bq); node = bq;
  }
  node.connect(g); g.connect(master);
  if(vib){ // vibrato na frequência
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = vib.rate; lg.gain.value = vib.depth;
    l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0+dur+.1);
  }
  if(trem){ // tremolo no volume
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = trem.rate; lg.gain.value = vol*trem.depth;
    l.connect(lg); lg.connect(g.gain); l.start(t0); l.stop(t0+dur+.1);
  }
  o.start(t0); o.stop(t0+dur+.1);
}

let noiseBuf = null;
function noise({dur,at=0,vol=.2,filt={type:"bandpass",f:[[0,1000]],q:1},att=.01,rel=.05}){
  if(!noiseBuf){
    noiseBuf = AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const t0 = AC.currentTime+at;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const bq = AC.createBiquadFilter(); bq.type = filt.type; bq.Q.value = filt.q||1;
  bq.frequency.setValueAtTime(filt.f[0][1],t0);
  for(let i=1;i<filt.f.length;i++) bq.frequency.linearRampToValueAtTime(filt.f[i][1],t0+filt.f[i][0]);
  const g = AC.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.setValueAtTime(vol,t0+Math.max(att,dur-rel));
  g.gain.linearRampToValueAtTime(.0001,t0+dur);
  s.connect(bq); bq.connect(g); g.connect(master);
  s.start(t0); s.stop(t0+dur+.1);
}

/* Cada animal: aproximação sintetizada do som real */
const SOUNDS = {
  vaca(){ // MUUU
    voice({f:[[0,110],[.5,150],[1.4,120],[1.7,95]],dur:1.8,vol:.5,
      filt:{type:"lowpass",f:[[0,500],[.6,1100],[1.7,400]],q:3},vib:{rate:5,depth:4}});
    voice({type:"square",f:[[0,110],[.5,150],[1.4,120],[1.7,95]],dur:1.8,vol:.12,
      filt:{type:"lowpass",f:[[0,400],[1.7,300]],q:1}});
  },
  cao(){ // AU AU
    [0,.38].forEach(a=>{
      voice({f:[[0,520],[.06,380],[.2,230]],dur:.22,at:a,vol:.5,
        filt:{type:"bandpass",f:[[0,1100],[.2,700]],q:2.5}});
      noise({dur:.14,at:a,vol:.25,filt:{type:"bandpass",f:[[0,1500]],q:1.2}});
    });
  },
  gato(){ // MIAU
    voice({f:[[0,420],[.18,760],[.55,640],[.9,380]],dur:.95,vol:.4,
      filt:{type:"bandpass",f:[[0,900],[.2,2200],[.55,1500],[.9,800]],q:4},vib:{rate:6,depth:10}});
  },
  ovelha(){ // BÉÉÉ
    voice({f:[[0,330],[.2,360],[.9,300]],dur:1.0,vol:.45,
      filt:{type:"bandpass",f:[[0,1200],[.9,1000]],q:3},trem:{rate:28,depth:.6},vib:{rate:9,depth:12}});
  },
  porco(){ // ÓINC ÓINC
    [0,.5].forEach(a=>{
      voice({f:[[0,170],[.08,260],[.22,150],[.3,120]],dur:.34,at:a,vol:.5,
        filt:{type:"bandpass",f:[[0,500],[.1,1000],[.3,600]],q:2.5},trem:{rate:35,depth:.5}});
      noise({dur:.28,at:a,vol:.22,filt:{type:"bandpass",f:[[0,700]],q:2}});
    });
  },
  galo(){ // CÓ-CÓ-RI-CÓÓÓ
    voice({f:[[0,520],[.2,700]],dur:.22,at:0,vol:.35,filt:{type:"bandpass",f:[[0,1600]],q:3}});
    voice({f:[[0,700],[.2,880]],dur:.22,at:.25,vol:.35,filt:{type:"bandpass",f:[[0,1800]],q:3}});
    voice({f:[[0,880],[.15,950]],dur:.16,at:.52,vol:.35,filt:{type:"bandpass",f:[[0,2000]],q:3}});
    voice({f:[[0,800],[.25,1050],[.9,750],[1.1,600]],dur:1.15,at:.72,vol:.4,
      filt:{type:"bandpass",f:[[0,1800],[.3,2300],[1.1,1500]],q:3},vib:{rate:7,depth:14}});
  },
  pato(){ // QUAC QUAC
    [0,.34].forEach(a=>{
      voice({f:[[0,520],[.06,430],[.2,320]],dur:.24,at:a,vol:.45,
        filt:{type:"bandpass",f:[[0,1300],[.2,900]],q:4},trem:{rate:60,depth:.4}});
      noise({dur:.2,at:a,vol:.15,filt:{type:"bandpass",f:[[0,1800]],q:2}});
    });
  },
  cavalo(){ // IIIHÓ
    voice({f:[[0,550],[.2,1100],[.7,900],[1.2,500],[1.5,300]],dur:1.6,vol:.4,
      filt:{type:"bandpass",f:[[0,1500],[.3,2400],[1.5,900]],q:2.5},vib:{rate:12,depth:25}});
    noise({dur:1.2,vol:.1,filt:{type:"bandpass",f:[[0,2500],[1.2,1200]],q:1.5}});
  },
  leao(){ // ROOOAR
    noise({dur:1.8,vol:.5,att:.15,rel:.5,filt:{type:"lowpass",f:[[0,700],[.5,1400],[1.8,350]],q:1.5}});
    voice({f:[[0,95],[.4,130],[1.6,70]],dur:1.8,vol:.45,att:.1,rel:.5,
      filt:{type:"lowpass",f:[[0,500],[.5,900],[1.8,250]],q:2},trem:{rate:22,depth:.7}});
  },
  elefante(){ // TRROMBETA
    voice({f:[[0,300],[.15,520],[.8,680],[1.2,480]],dur:1.3,vol:.4,att:.04,
      filt:{type:"bandpass",f:[[0,1000],[.8,2000]],q:2},vib:{rate:14,depth:30}});

function decode(ab){
  return new Promise((ok,fail)=>{ const p = AC.decodeAudioData(ab,ok,fail); if(p&&p.catch) p.catch(fail); });
}
/* escolhe a janela mais forte de 'max' segundos e normaliza o volume */
function prepare(buf,max){
  const sr = buf.sampleRate, d = buf.getChannelData(0), n = d.length;
  const win = Math.min(n, Math.round(max*sr)), blk = Math.round(sr*.05);
  const e = []; for(let i=0;i<n;i+=blk){ let s=0; const end=Math.min(n,i+blk); for(let j=i;j<end;j++) s+=d[j]*d[j]; e.push(s); }
  const wb = Math.max(1,Math.round(win/blk)); let best=0, bestS=-1, cur=0;
  for(let i=0;i<e.length;i++){ cur+=e[i]; if(i>=wb) cur-=e[i-wb]; if(i>=wb-1 && cur>bestS){ bestS=cur; best=i-wb+1; } }
  let start = Math.max(0,best*blk); if(start+win>n) start=Math.max(0,n-win);
  let pk=0; for(let j=start;j<start+win;j++){ const a=Math.abs(d[j]); if(a>pk) pk=a; }
  return {buf, start:start/sr, dur:win/sr, gain: pk>0 ? Math.min(6,.9/pk) : 1};
}
async function loadReal(){
  if(realStarted) return; realStarted = true;
  await Promise.all(Object.entries(REAL).map(async ([id,r])=>{
    try{
      const resp = await fetch(W+r.u); if(!resp.ok) return;
      REALBUF[id] = prepare(await decode(await resp.arrayBuffer()), r.max);
    }catch(e){ /* sem internet: fica o som sintetizado */ }
  }));
}
function playReal(id){
  const r = REALBUF[id], c = REAL[id], reps = c.rep||1;
  for(let k=0;k<reps;k++){
    const t0 = AC.currentTime + k*(r.dur+.2);
    const s = AC.createBufferSource(); s.buffer = r.buf;
    const g = AC.createGain(), fi=.03, fo=Math.min(.25,r.dur/3);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(r.gain,t0+fi);
    g.gain.setValueAtTime(r.gain,t0+r.dur-fo);
    g.gain.linearRampToValueAtTime(0,t0+r.dur);
    s.connect(g); g.connect(master);
    s.start(t0,r.start,r.dur);
  }
}

let speakId = 0;
/* Diz o texto e, SÓ QUANDO TERMINA, chama 'then' (ex.: tocar o som do animal).
   Se a voz não existir ou falhar, 'then' é chamado na mesma, após um curto tempo. */
function speak(text, then){
  const id = ++speakId;
  let done = false;
  const fin = ()=>{ if(done) return; done = true; if(then && id===speakId) then(); };
  try{
    if(!("speechSynthesis" in window)){ setTimeout(fin,300); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-PT"; u.rate = .85; u.pitch = 1.25;
    const v = speechSynthesis.getVoices().find(v=>/pt[-_]PT/i.test(v.lang)) ||
              speechSynthesis.getVoices().find(v=>/^pt/i.test(v.lang));
    if(v) u.voice = v;
    u.onend = ()=>setTimeout(fin,150);
    u.onerror = ()=>fin();
    speechSynthesis.speak(u);
    setTimeout(fin, 4000);          // segurança (alguns aparelhos não avisam quando acaba)
  }catch(e){ setTimeout(fin,300); }
}

function emojiOK(ch){
  try{
    const c = document.createElement("canvas"); c.width = c.height = 40;
    const x = c.getContext("2d"); x.font = "30px sans-serif"; x.textBaseline = "top";
    x.fillText(ch,2,2); const a = x.getImageData(0,0,40,40).data;
    // um emoji desenhado tem cores; o quadrado de "símbolo em falta" é só preto/cinzento
    let colored = 0;
    for(let i=0;i<a.length;i+=4){
      if(a[i+3]>200 && Math.max(a[i],a[i+1],a[i+2])-Math.min(a[i],a[i+1],a[i+2])>35) colored++;
    }
    return colored > 25;
  }catch(e){ return false; }   // em caso de dúvida, usa o desenho próprio (nunca falha)
}

function answer(el,a,next){
  if(locked) return;
  initAudio();
  if(a===target){
    locked = true;
    el.classList.add("good"); el.classList.remove("hide-name"); bounce(el);
    sfxWin(); confetti(); addStar();
    // "Muito bem!" + nome, e só depois o som do animal
    setTimeout(()=>speak("Muito bem! "+a.n, ()=>{ SOUNDS[a.s](); animate(el,a); }), 500);
    const m = mode;
    setTimeout(()=>{ if(mode===m) next(); },6500);
  }else{
    shake(el); sfxOops();
    speak("Tenta outra vez!");
  }
}

/* tocar na foto em cima volta ao ecrã "Quem vai jogar?" */
document.getElementById("player").onclick = ()=>{
  try{ speechSynthesis.cancel(); }catch(e){}
  speakId++;
  document.getElementById("start").style.display = "flex";
};

document.getElementById("credits").innerHTML = Object.entries(REAL).map(([id,r])=>{
  const a = byId[id];
  const link = "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(r.t.replace(/ /g,"_"));
  return `<li>${a.e} <a href="${link}" target="_blank" rel="noopener">${r.t.replace(/</g,"&lt;")}</a> — ${r.by.replace(/</g,"&lt;")}, ${r.lic}</li>`;
}).join("");

drawStars();
setMode(1);   // a grelha fica por trás do ecrã "Quem vai jogar?" até alguém escolher
</script>
</body>
</html>
